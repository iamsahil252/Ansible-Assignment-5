---
# tasks file for roles/grafana

- name: Load OS specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_facts.distribution | lower }}.yml"

- name: Install Grafana on Ubuntu
  when: ansible_facts.os_family == "Debian"
  block:

    - name: Install required packages on Ubuntu
      ansible.builtin.apt:
        name:
          - wget
          - gpg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /tmp/grafana.gpg.key
        mode: "0644"

    - name: Convert Grafana GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/grafana.gpg /tmp/grafana.gpg.key
        creates: /etc/apt/keyrings/grafana.gpg

    - name: Add Grafana repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: "{{ grafana_package }}"
        state: present
        update_cache: true

- name: Install Grafana on Amazon Linux
  when: ansible_facts.os_family == "RedHat"
  block:

    - name: Create Grafana repository
      ansible.builtin.yum_repository:
        name: grafana
        description: Grafana OSS Repository
        baseurl: https://rpm.grafana.com
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://rpm.grafana.com/gpg.key
        sslverify: true
        state: present

    - name: Install Grafana
      ansible.builtin.dnf:
        name: "{{ grafana_package }}"
        state: present

- name: Create Grafana configuration directory
  ansible.builtin.file:
    path: "{{ grafana_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Grafana configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_file }}"
    mode: "0644"
  notify: Restart Grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true